name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Agentic.Chat.Client/**"
      - "Agentic.Chat/Components/**"
      - "Agentic.Chat/Models/**"
      - "Agentic.Chat/Services/ChatAgentService.cs"
      - "Agentic.Chat/Services/ContextWindow.cs"
      - "Agentic.Chat/Services/ConversationTitle.cs"
      - "Agentic.Chat/Services/IOpenRouterClient.cs"
      - "Agentic.Chat/Services/MarkdownRenderer.cs"
      - "Agentic.Chat/Services/OpenRouterException.cs"
      - "Agentic.Chat/Services/OpenRouterOptions.cs"
      - "Agentic.Chat/Services/UsageFormatter.cs"
      - "Agentic.Chat/Services/MultiAgent/**"
      - "Agentic.Chat/Components/MultiAgent/**"
      - "Directory.Build.props"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish WebAssembly client
        run: dotnet publish Agentic.Chat.Client/Agentic.Chat.Client.csproj -c Release

      - name: Configure Pages base path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          publish_dir='Agentic.Chat.Client/bin/Release/net10.0/publish/wwwroot'
          base_href="${PAGES_BASE_PATH%/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base_href\" />|" "$publish_dir/index.html"
          sed -i "s|__PAGES_BASE_PATH__|${PAGES_BASE_PATH%/}|g" "$publish_dir/404.html"
          rm -f "$publish_dir/404.html.br" "$publish_dir/404.html.gz"

      - name: Add shared free-model key
        shell: bash
        env:
          OPENROUTER_FREE_API_KEY: ${{ secrets.OPENROUTER_FREE_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_FREE_API_KEY" ]; then
            echo 'Repository secret OPENROUTER_FREE_API_KEY is required.' >&2
            exit 1
          fi
          publish_dir='Agentic.Chat.Client/bin/Release/net10.0/publish/wwwroot'
          jq -n --arg key "$OPENROUTER_FREE_API_KEY" \
            '{openRouterFreeApiKey: $key}' > "$publish_dir/app-config.json"
          rm -f "$publish_dir/app-config.json.br" "$publish_dir/app-config.json.gz"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: Agentic.Chat.Client/bin/Release/net10.0/publish/wwwroot

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
