<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1418" />
    <!-- The type system is not optional: app.css builds every scale on Syne /
         Figtree / JetBrains Mono. Without these the whole client silently fell
         back to Segoe UI. Mirrors Agentic.Chat/Components/App.razor. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Agentic.Chat.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Restore routes redirected through 404.html on GitHub Pages.
        (() => {
            const query = window.location.search;
            if (!query.startsWith("?/")) return;
            const decoded = query.slice(2).replace("&", "?");
            const base = window.location.pathname.endsWith("/")
                ? window.location.pathname
                : `${window.location.pathname}/`;
            window.history.replaceState(null, "", `${base}${decoded}${window.location.hash}`);
        })();
    </script>
    <script>
        (() => {
            const key = "agentic-theme";
            const readTheme = () => {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            };
            const writeTheme = theme => {
                try {
                    if (theme === null) localStorage.removeItem(key);
                    else localStorage.setItem(key, theme);
                } catch {
                    // Theme persistence is optional when browser storage is blocked.
                }
            };
            const theme = readTheme();
            if (theme === "light" || theme === "dark") {
                document.documentElement.dataset.theme = theme;
            }
            window.agenticTheme = {
                set(theme) {
                    if (theme === "auto") {
                        writeTheme(null);
                        delete document.documentElement.dataset.theme;
                    } else {
                        writeTheme(theme);
                        document.documentElement.dataset.theme = theme;
                    }
                },
                get() {
                    return readTheme() ?? "auto";
                },
                cycle(button) {
                    const themes = ["auto", "light", "dark"];
                    const theme = themes[(themes.indexOf(this.get()) + 1) % themes.length];
                    this.set(theme);
                    this.renderButton(button);
                },
                renderButton(button) {
                    const theme = this.get();
                    button.textContent = `Theme: ${theme[0].toUpperCase()}${theme.slice(1)}`;
                    button.setAttribute("aria-label", `Theme: ${theme}. Activate to change.`);
                }
            };
            // The markup ships a hardcoded "Theme: Auto" label, so without this
            // the button keeps claiming Auto after a stored Light/Dark choice is
            // restored. WebAssembly renders it after boot, so watch for it and
            // stop as soon as it lands — a standing observer would re-run on
            // every streamed token.
            const paint = () => {
                const buttons = document.querySelectorAll(".theme-toggle");
                buttons.forEach(button => window.agenticTheme.renderButton(button));
                return buttons.length > 0;
            };
            if (!paint()) {
                const observer = new MutationObserver(() => {
                    if (paint()) observer.disconnect();
                });
                observer.observe(document.body ?? document.documentElement, {
                    childList: true,
                    subtree: true
                });
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
